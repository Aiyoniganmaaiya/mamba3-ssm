[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba3-ssm"
version = "0.1.2"
description = "Mamba-3: Improved Sequence Modeling using State Space Principles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aiyoniganmaaiya", email = "gerintacc004@gmail.com"},
]
keywords = ["mamba", "ssm", "state-space-model", "transformer", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "torch>=2.0",
    "einops>=0.7",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Aiyoniganmaaiya/mamba3-ssm"
Repository = "https://github.com/Aiyoniganmaaiya/mamba3-ssm"
